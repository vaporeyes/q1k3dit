<!-- ABOUTME: Browser entry point for the Q1K3 block map editor. -->
<!-- ABOUTME: Loads the editor UI, canvas workspace, and import/export controls. -->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q1K3DIT</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<header class="topbar">
		<div>
			<p class="eyebrow">Q1K3 map editor</p>
			<h1>Q1K3DIT</h1>
		</div>
		<nav class="actions" aria-label="File actions">
			<label class="button ghost">
				<input id="mapImport" type="file" accept=".map,text/plain">
				Import .map
			</label>
			<button id="exportMap" class="button">Export .map</button>
			<button id="exportPlb" class="button accent">Export .plb</button>
		</nav>
	</header>

	<main class="shell">
		<section class="toolbar" aria-label="Editor tools">
			<button class="tool is-active" data-tool="select" title="Select">S</button>
			<button class="tool" data-tool="block" title="Place block">B</button>
			<button class="tool" data-tool="erase" title="Erase">X</button>
			<button class="tool" data-tool="entity" title="Place entity">E</button>
			<div class="divider"></div>
			<label class="compact-field">
				<span>Layer</span>
				<input id="layerInput" type="number" min="0" max="127" value="0">
			</label>
			<button id="layerDown" class="tool" title="Layer down">-</button>
			<button id="layerUp" class="tool" title="Layer up">+</button>
		</section>

		<section class="workspace">
			<div class="canvas-wrap">
				<canvas id="mapCanvas" width="1400" height="900" aria-label="3D map editor canvas"></canvas>
				<div id="status" class="status">Ready</div>
			</div>
			<aside class="side">
				<section>
					<h2>View</h2>
					<div class="button-row">
						<button id="viewIso" class="button small">Iso</button>
						<button id="viewTop" class="button small">Top</button>
						<button id="viewReset" class="button small">Reset</button>
					</div>
					<div class="button-row">
						<button id="focusSelection" class="button small">Focus</button>
						<label class="toggle-field"><input id="showGrid" type="checkbox" checked> Grid</label>
						<label class="toggle-field"><input id="showLighting" type="checkbox" checked> Lighting</label>
					</div>
				</section>

				<section>
					<h2>Brush</h2>
					<div class="grid-fields">
						<label>X <input id="blockX" type="number" min="0" max="127"></label>
						<label>Y <input id="blockY" type="number" min="0" max="127"></label>
						<label>Z <input id="blockZ" type="number" min="0" max="127"></label>
						<label>SX <input id="blockSx" type="number" min="1" max="127"></label>
						<label>SY <input id="blockSy" type="number" min="1" max="127"></label>
						<label>SZ <input id="blockSz" type="number" min="1" max="127"></label>
					</div>
					<label class="wide-field">Placement height <input id="brushHeight" type="number" min="1" max="127" value="1"></label>
					<label class="wide-field">Texture <input id="textureInput" type="number" min="0" max="30" value="1"></label>
					<div id="texturePalette" class="palette" aria-label="Texture palette"></div>
				</section>

				<section>
					<h2>Lighting</h2>
					<label class="wide-field">Ambient <input id="ambientLight" type="range" min="0" max="100" value="42"></label>
					<label class="wide-field">Sun angle <input id="sunAngle" type="range" min="0" max="360" value="315"></label>
					<div class="grid-fields two">
						<label>Power <input id="lightPower" type="number" min="0" max="255" value="192"></label>
						<label>Color <input id="lightColor" type="color" value="#ffdcb4"></label>
					</div>
					<button id="addLight" class="button full">Add light here</button>
				</section>

				<section>
					<h2>Entity</h2>
					<label class="wide-field">Type <select id="entityType"></select></label>
					<div class="grid-fields">
						<label>X <input id="entityX" type="number" min="0" max="127"></label>
						<label>Y <input id="entityY" type="number" min="0" max="127"></label>
						<label>Z <input id="entityZ" type="number" min="0" max="127"></label>
						<label>P1 <input id="entityP1" type="number" min="0" max="255"></label>
						<label>P2 <input id="entityP2" type="number" min="0" max="255"></label>
					</div>
				</section>

				<section>
					<h2>Map</h2>
					<div class="stats">
						<span id="blockCount">0 brushes</span>
						<span id="entityCount">0 entities</span>
						<span id="unsupportedCount">0 skipped</span>
					</div>
					<button id="deleteSelected" class="button full">Delete selected</button>
					<button id="addRoom" class="button full">Add starter room</button>
					<button id="clearMap" class="button ghost full">Clear</button>
				</section>
			</aside>
		</section>
	</main>

	<script src="app.js"></script>
</body>
</html>
